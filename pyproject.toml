[project]
name = "airdrop"
version = "0.3.0"
description = "CUADC 固定翼无人机侦查与空投控制系统"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "太原理工大学航模协会" }, { name = "燕羿洋" }]
requires-python = ">=3.14"
dependencies = [
    "av>=19.0.2",
    "imageio-ffmpeg",
    "mavsdk",
    "numpy",
    "opencv-python",
    "pillow",
    "pyproj",
    "rapidocr",
    "scikit-learn>=1.9.1",
    "scipy",
    "torch",
    "torchvision>=0.28.0",
    "ultralytics>=8.4.120",
]

[project.optional-dependencies]
# TensorRT 推理运行时与离线引擎构建（python -m airdrop.run build-trt）所需可选依赖
trt = [
    "onnx>=1.23.0",
    "tensorrt>=11.4.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.8",
]

# ======================================================================
# uv —— 依赖索引与源绑定
# ======================================================================
[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

# ======================================================================
# Ruff —— 静态检查与代码格式化
# ======================================================================
[tool.ruff]
line-length = 100
target-version = "py314"
# 排除只读第三方参考源码、虚拟环境、本地运行/模型/航线目录、独立子仓与测试临时目录
extend-exclude = [
    "PX4-Autopilot-1.17.0",
    "qgroundcontrol-master",
    ".venv",
    "flights",
    "models",
    "routes",
    "vendor",
    ".pytest-tmp",
    "pytest-cache-files-*",
]

[tool.ruff.lint]
# 显式选择与中文工程代码兼容的规则集，避免与中文全角标点习惯冲突
select = [
    "E4",  # pycodestyle：模块导入规范
    "E7",  # pycodestyle：语句级检查
    "E9",  # pycodestyle：语法与解析错误
    "F",   # Pyflakes：未使用导入/变量与未定义名称
    "W",   # pycodestyle：常规警告（含 W605 无效转义）
    "I",   # isort：导入分组与排序
    "UP",  # pyupgrade：Python 3.14 现代语法与类型标注
    "B",   # flake8-bugbear：常见缺陷与陷阱
    "SIM", # flake8-simplify：控制流与表达式简化
    "C4",  # flake8-comprehensions：推导式规范
    "RUF", # Ruff 内置扩展规则
    "BLE", # flake8-blind-except：约束未标注的宽泛异常捕获
    "SLF", # flake8-self：私有成员访问约束
    "PL",  # Pylint：复杂度与结构检查
    "PT",  # flake8-pytest-style：pytest 用例规范
]
ignore = [
    # UP037 按 token 扫描字符串字面量，易误伤中文 docstring 与排版标注
    "UP037",
    # 科学计算、物理阈值与测试夹具中的数值字面量直接使用更具可读性
    "PLR2004",
    # 重型依赖遵循按需惰性导入契约，允许在函数体内导入
    "PLC0415",
    # 允许在测试与源码中采用守卫式复合断言（assert x is not None and x.ok）
    "PT018",
    # 对 numpy 标量保留显式 int(round(...)) 收窄，防止 numpy 标量类型透传至下游
    "RUF046",
]
# 保留 RUF001/RUF002/RUF003 以拦截形近字符误用，仅精准放行中文排版全角标点与常用符号
allowed-confusables = [
    "（", # FULLWIDTH LEFT PARENTHESIS
    "）", # FULLWIDTH RIGHT PARENTHESIS
    "，", # FULLWIDTH COMMA
    "：", # FULLWIDTH COLON
    "；", # FULLWIDTH SEMICOLON
    "？", # FULLWIDTH QUESTION MARK
    "×", # MULTIPLICATION SIGN
    "−", # MINUS SIGN
    "–", # EN DASH
    "α", # GREEK SMALL LETTER ALPHA
    "ρ", # GREEK SMALL LETTER RHO
    "σ", # GREEK SMALL LETTER SIGMA
]

[tool.ruff.lint.pylint]
# 放宽多参数配置组装与计算流水线函数的复杂度上限
max-args = 10
max-positional-args = 6
max-branches = 15
max-statements = 60
max-returns = 8

[tool.ruff.lint.per-file-ignores]
# tests/conftest.py 须在初始化测试环境后再导入被测模块，保留延迟顶部导入
"tests/conftest.py" = ["E402"]
# 测试允许访问受测对象私有状态、使用宽泛异常匹配及参数较多的参数化夹具
"tests/**" = [
    "B007",
    "C408",
    "E741",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLW2901",
    "PT011",
    "RUF005",
    "RUF007",
    "RUF015",
    "RUF043",
    "RUF059",
    "SIM102",
    "SLF001",
    "UP031",
]
# 开发脚本需展开较多配置参数与格式化输出，适当放宽函数复杂度限制
"tools/**" = ["PLR0913", "PLR0915", "PLR0917", "PLW2901", "UP031"]
# 惰性导出包按"常量 -> 类 -> 函数"分组组织 __all__（供接口导出与文档校验工具解析）
"airdrop/__init__.py" = ["RUF022"]
"airdrop/*/__init__.py" = ["F401", "RUF022"]

[tool.ruff.lint.isort]
known-first-party = ["airdrop", "tools"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
# line-length 仅用于指导格式化器折行；保持 E501 关闭，避免不可折行的长 URL、
# 长字符串字面量或行尾 noqa 触发误报。Python 3.14 按 PEP 758 支持不带括号的 except A, B:。

# ======================================================================
# Pyright —— 静态类型检查
# ======================================================================
[tool.pyright]
extraPaths = ["vendor/airdrop-sim", "vendor/airdrop-calibration"]
include = ["airdrop", "tests", "tools"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.venv",
    "**/venv",
    "**/.tox",
    "**/.mypy_cache",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "**/.*",
    "PX4-Autopilot-1.17.0",
    "qgroundcontrol-master",
    "flights",
    "models",
    "routes",
]
# 第三方依赖类型桩覆盖不一，采用 basic 模式以减少外部噪声
typeCheckingMode = "basic"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
# 顶层及子包采用 PEP 562 惰性导出，__all__ 一致性由单测校验
reportUnsupportedDunderAll = "none"
# 与 Ruff 配置对齐，允许测试及包内跨模块访问受测私有成员
reportPrivateUsage = "none"

# ======================================================================
# Pytest & Coverage —— 测试与覆盖率配置
# ======================================================================
[tool.pytest.ini_options]
# 测试分层由 tests/conftest.py 的 --test-tier 控制，默认执行 fast 层级
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "stream: 需要 ffmpeg 与本地 UDP 端口（会起子进程）",
    "network: 走网络错误路径，需要等超时或连接被拒",
    "integration: 跨模块、跨仓库或真实子进程集成回归",
    "wsl: 需要 WSL 或 ext4 行为，仅平台 tier 运行",
    "realdata: 需要 GPU 与真实素材/权重（如 AIRDROP_REALDATA_VIDEO 与 PP-OCR 权重）",
    "sitl: 需要预先启动的 WSL PX4 SITL 与 Gazebo 图传环境",
]
# Windows 平台无 SIGALRM，统一使用线程超时防止拉流或子进程用例挂死
timeout = 180
timeout_method = "thread"

[tool.coverage.run]
branch = true
source = ["airdrop"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
