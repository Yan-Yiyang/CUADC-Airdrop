[project]
name = "airdrop"
version = "2.3.0"
requires-python = ">=3.14"
dependencies = [
    "imageio-ffmpeg",
    "mavsdk",
    "opencv-python",
    "pillow",
    "pyproj",
    "pyyaml",
    "rapidocr",
    "scikit-learn>=1.9.1",
    "scipy",
    "torch",
    "torchvision>=0.28.0",
    "ultralytics>=8.4.120",
    "vgamepad",
]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra：汇总非通过用例的原因；--strict-*：标记/配置写错就直接报错，不许静默放过
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # realdata 用例要 GPU + 旧版 实战素材（分钟级、依赖外部文件），
    # 默认跳过；要跑就显式 `-m realdata`
    "-m",
    "not realdata",
    "--cov=airdrop",
    "--cov-report=term-missing:skip-covered",
]
markers = [
    "stream: 需要 ffmpeg 与本机 UDP 端口（会起子进程，秒级）",
    "network: 走网络错误路径，需要等超时或连接被拒",
    "realdata: 需要 GPU + 真实素材/权重（旧版 实战视频、PP-OCR 权重），分钟级",
]
# 全局超时兜底：拉流用例一旦卡住（管道读不回、子进程不退）要能失败而不是挂死。
# Windows 上没有 SIGALRM，必须用 thread 方式。
timeout = 180
timeout_method = "thread"

[tool.coverage.run]
branch = true
source = ["airdrop"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
